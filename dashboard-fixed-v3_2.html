    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8F9FA;
            --bg-card: #FFFFFF;
            --bg-glass: rgba(255, 255, 255, 0.9);
            --text-primary: #2D3748;
            --text-secondary: #718096;
            --text-muted: #A0AEC0;
            --pink-primary: #fb0b8c;
            --pink-light: #ff4da6;
            --pink-dark: #d10075;
            --purple-primary: #a855f7;
            --green-primary: #00a747;
            --green-dark: #008537;
            --green-success: #10B981;
            --red-danger: #EF4444;
            --orange-warning: #F59E0B;
            --blue-info: #3B82F6;
            --border-color: #E5E7EB;
            --border-light: rgba(0, 0, 0, 0.1);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-pink: 0 15px 35px rgba(251, 11, 140, 0.2);

            --gradient-subtle: linear-gradient(to bottom, rgba(255, 27, 141, 0.05), transparent);
            --bg-pattern-1: rgba(251, 11, 140, 0.08);
            --bg-pattern-2: rgba(42, 233, 123, 0.05);
            --bg-pattern-3: rgba(168, 85, 247, 0.05);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-glass: rgba(30, 41, 59, 0.9);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --border-light: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --shadow-pink: 0 15px 35px rgba(251, 11, 140, 0.4);
            --gradient-subtle: linear-gradient(to bottom, rgba(255, 27, 141, 0.1), transparent);
            --bg-pattern-1: rgba(251, 11, 140, 0.15);
            --bg-pattern-2: rgba(42, 233, 123, 0.1);
            --bg-pattern-3: rgba(168, 85, 247, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 80%, var(--bg-pattern-1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, var(--bg-pattern-2) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, var(--bg-pattern-3) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .dashboard-container {
            max-width: 960px !important;
            margin: 0 auto;
            padding: 20px;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow { animation: pulse-slow 3s ease-in-out infinite; }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-gradient { background-size: 200% 200%; animation: gradient 5s ease infinite; }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .logo-float { animation: logoFloat 3s ease-in-out infinite; }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient-pink);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: var(--shadow-pink);
        }

        .theme-toggle svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .page-nav {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 12px;
            margin: 80px 0 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .nav-link {
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9em;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: rgba(251, 11, 140, 0.1);
            color: var(--pink-light);
            border-color: rgba(251, 11, 140, 0.3);
        }

        .nav-link.active {
            background: var(--gradient-pink);
            color: white;
        }

        .tabloid-header {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 50px 40px 40px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .tabloid-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-pink);
        }

        .logo-container-centered {
            width: 135px;
            height: 135px;
            margin: 0 auto 20px;
            position: relative;
            filter: drop-shadow(0 0 30px rgba(251, 11, 140, 0.5));
        }

        .logo-container-centered svg { width: 100%; height: 100%; }

        .header-separator {
            width: 80px;
            height: 3px;
            background: var(--gradient-pink);
            margin: 0 auto 25px;
            border-radius: 2px;
            opacity: 0.6;
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            background: var(--gradient-pink);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            margin-bottom: 12px;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1em;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(251, 11, 140, 0.1);
            border: 1px solid rgba(251, 11, 140, 0.3);
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.95em;
            color: var(--pink-light);
            margin-top: 10px;
        }

        .brand-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--green-primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .api-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75em;
            color: var(--text-muted);
            margin-top: 15px;
        }

        .api-status .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green-success);
            animation: pulse 2s infinite;
        }

        .api-status.error .status-dot { background: var(--red-danger); }

        @media (max-width: 768px) {
            .dashboard-container { padding: 15px; }
            .tabloid-header { padding: 40px 25px 30px; }
            .brand-title { font-size: 1.9em; }
            .logo-container-centered { width: 110px; height: 110px; }
            .theme-toggle { top: 10px; right: 10px; width: 45px; height: 45px; }
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CONFIG = {
            CONTRACT_ADDRESS: '0x66c6Fc5E7F99272134a52DF9E88D94eD83E89278',
            LP_PAIR_ADDRESS: '0xF3a06E9Dc5d89B2fD8d7d30946c9aeddc5e01E28',
            BSCSCAN_API_KEY: 'X71C56MH6FJ1YFR26EUI39TE8KZA3N2WXM',
            DEAD_ADDRESS: '0x000000000000000000000000000000000000dEaD',
            DECIMALS: 18,
            TOTAL_SUPPLY: 100000
        };

        const Icon = ({ name, ...props }) => {
            const iconRef = React.useRef(null);

            return <i ref={iconRef} data-lucide={name} {...props}></i>;
        };

        const PTDTLogo = () => (

                    <rect x="7.34" y="20.11" width="14.01" height="3.66" fill="url(#logoGradH)"/>
                </g></g></g></g>
                <path d="M15.14,12.47c-.21-.34,2.18-3.91,4.97-4.8-3.22,.47-5.62,2.79-5.76,2.93,0,0-.02,.01-.02,.01,0,0,.01,0,.02-.01,0,0,.01,0,.02,.01h-.02c.64-.63,.45-.1,0,.85-.45-.95-.64-1.48,0-.86-.14-.15-2.55-2.46-5.76-2.93,2.79,.89,5.18,4.46,4.97,4.8-.57,.94-1.12,2.19-1.21,3.55-.03,.14-.05,.26-.05,.36,0,3.18,2.03,5.76,2.03,5.76,0,0,0,0,.02-.01,0,0,.01,.01,.01,.01,0,0,2.03-2.57,2.03-5.76,0-.1-.01-.22-.04-.36-.09-1.36-.63-2.61-1.21-3.55" fill="#fb0b8c"/>
                <path d="M15.75,8.26c0,.77-.62,1.39-1.39,1.39s-1.4-.62-1.4-1.39,.63-1.39,1.4-1.39,1.39,.62,1.39,1.39" fill="#fb068c"/>
            </svg>
        );

        const LoadingSkeleton = () => (
            <div className="animate-pulse bg-gradient-to-r from-gray-200 via-gray-300 to-gray-200 rounded h-8"></div>
        );

        const PTDTDashboard = () => {
            const [metrics, setMetrics] = useState({
                price: 0,
                priceChange24h: 0,
                totalSupply: CONFIG.TOTAL_SUPPLY,
                circulatingSupply: CONFIG.TOTAL_SUPPLY,
                holders: 0,
                marketCap: 0,
                volume24h: 0,
                liquidity: 0,
                transactions24h: 0,
                burnedTokens: 0,
                lpLocked: 5000,
                loading: true,
                error: null,
                lastUpdate: null
            });

            const [recentTxs, setRecentTxs] = useState([]);
            const [autoRefresh, setAutoRefresh] = useState(true);
            const [countdown, setCountdown] = useState(30);
            const [connectedWallet, setConnectedWallet] = useState(null);
            const [userBalance, setUserBalance] = useState(0);

            const detectMetaMask = async () => {
                if (typeof window.ethereum !== 'undefined') {
                    if (window.ethereum.isMetaMask) return window.ethereum;
                    return window.ethereum;
                }
                return new Promise((resolve) => {
                    let attempts = 0;
                    const check = setInterval(() => {
                        attempts++;
                        if (typeof window.ethereum !== 'undefined') {
                            clearInterval(check);
                            resolve(window.ethereum);
                        } else if (attempts >= 50) {
                            clearInterval(check);
                            resolve(null);
                        }
                    }, 100);
                });
            };

            const fetchDexScreenerData = async () => {
                try {
                    const response = await fetch(`https://api.dexscreener.com/latest/dex/pairs/bsc/${CONFIG.LP_PAIR_ADDRESS}`);
                    const data = await response.json();
                    if (data?.pairs && data.pairs.length > 0) {
                        const pair = data.pairs[0];
                        return {
                            success: true,
                            price: parseFloat(pair.priceUsd || 0),
                            priceChange24h: parseFloat(pair.priceChange?.h24 || 0),
                            volume24h: parseFloat(pair.volume?.h24 || 0),
                            liquidity: parseFloat(pair.liquidity?.usd || 0),
                            txns24h: (pair.txns?.h24?.buys || 0) + (pair.txns?.h24?.sells || 0)
                        };
                    }
                    return { success: false };
                } catch (error) {
                    console.error('DexScreener error:', error);
                    return { success: false };
                }
            };

            // Recent Transactions (robust): try BOTH (a) token transfers and (b) normal txns,
            // and show whichever yields data.
            const fetchRecentTransactions = async () => {
                const urls = {
                    tokenTx: `https://api.bscscan.com/api?module=account&action=tokentx&contractaddress=${CONFIG.CONTRACT_ADDRESS}&page=1&offset=20&sort=desc&apikey=${CONFIG.BSCSCAN_API_KEY}`,
                    normalTx: `https://api.bscscan.com/api?module=account&action=txlist&address=${CONFIG.CONTRACT_ADDRESS}&page=1&offset=20&sort=desc&apikey=${CONFIG.BSCSCAN_API_KEY}`
                };

                try {
                    const [tokenRes, normalRes] = await Promise.all([
                        fetch(urls.tokenTx).then(r => r.json()).catch(() => null),
                        fetch(urls.normalTx).then(r => r.json()).catch(() => null)
                    ]);

                    let picked = [];

                    if (tokenRes && tokenRes.status === '1' && Array.isArray(tokenRes.result) && tokenRes.result.length) {
                        picked = tokenRes.result.map(tx => ({
                            kind: 'tokentx',
                            hash: tx.hash,
                            timeStamp: tx.timeStamp,
                            from: tx.from,
                            to: tx.to,
                            valueRaw: tx.value,
                            value: parseFloat(tx.value) / 1e18,
                        }));
                    } else if (normalRes && normalRes.status === '1' && Array.isArray(normalRes.result) && normalRes.result.length) {
                        picked = normalRes.result.map(tx => ({
                            kind: 'txlist',
                            hash: tx.hash,
                            timeStamp: tx.timeStamp,
                            from: tx.from,
                            to: tx.to,
                            valueRaw: tx.value,
                            // NOTE: normal tx value is in wei BNB, not PTDT.
                            value: parseFloat(tx.value) / 1e18,
                        }));
                    }

                    setRecentTxs(picked.map(tx => ({
                        ...tx,
                        isWhale: tx.kind === 'tokentx' ? tx.value > 100 : false,
                    })));
                } catch (e) {
                    console.error('Recent tx fetch error:', e);
                    setRecentTxs([]);
                }
            };

            const fetchBurnedTokens = async () => {
                try {
                    const response = await fetch(
                        `https://api.bscscan.com/api?module=account&action=tokenbalance&contractaddress=${CONFIG.CONTRACT_ADDRESS}&address=${CONFIG.DEAD_ADDRESS}&tag=latest&apikey=${CONFIG.BSCSCAN_API_KEY}`
                    );
                    const data = await response.json();
                    if (data.status === '1') return parseFloat(data.result) / 1e18;
                    return 0;
                } catch (error) {
                    console.error('Burned tokens error:', error);
                    return 0;
                }
            };

            const fetchAllMetrics = async () => {
                setMetrics(prev => ({ ...prev, loading: true, error: null }));

                try {
                    const [dexData, burned] = await Promise.all([
                        fetchDexScreenerData(),
                        fetchBurnedTokens()
                    ]);

                    const circulating = CONFIG.TOTAL_SUPPLY - burned;
                    const marketCap = dexData.success ? dexData.price * circulating : 0;

                    setMetrics({
                        price: dexData.success ? dexData.price : 0,
                        priceChange24h: dexData.success ? dexData.priceChange24h : 0,
                        totalSupply: CONFIG.TOTAL_SUPPLY,
                        circulatingSupply: circulating,
                        holders: 0,
                        marketCap: marketCap,
                        volume24h: dexData.success ? dexData.volume24h : 0,
                        liquidity: dexData.success ? dexData.liquidity : 0,
                        transactions24h: dexData.success ? dexData.txns24h : 0,
                        burnedTokens: burned,
                        lpLocked: 5000,
                        loading: false,
                        error: null,
                        lastUpdate: new Date()
                    });

                    await fetchRecentTransactions();
                } catch (error) {
                    console.error('Fetch error:', error);
                    setMetrics(prev => ({
                        ...prev,
                        loading: false,
                        error: 'Failed to fetch data. Retrying...'
                    }));
                }
            };

            const connectWallet = async () => {
                const provider = await detectMetaMask();
                if (!provider) {
                    alert('MetaMask not detected! Please install MetaMask from metamask.io');
                    window.open('https://metamask.io/download/', '_blank');
                    return;
                }

                try {
                    const accounts = await provider.request({ method: 'eth_requestAccounts' });
                    const chainId = await provider.request({ method: 'eth_chainId' });

                    if (chainId !== '0x38') {
                        try {
                            await provider.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0x38' }]
                            });
                        } catch (switchError) {
                            if (switchError.code === 4902) {
                                await provider.request({
                                    method: 'wallet_addEthereumChain',
                                    params: [{
                                        chainId: '0x38',
                                        chainName: 'BSC Mainnet',
                                        nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                                        rpcUrls: ['https://bsc-dataseed.binance.org/'],
                                        blockExplorerUrls: ['https://bscscan.com']
                                    }]
                                });
                            }
                        }
                    }

                    setConnectedWallet(accounts[0]);

                    const balanceResponse = await fetch(
                        `https://api.bscscan.com/api?module=account&action=tokenbalance&contractaddress=${CONFIG.CONTRACT_ADDRESS}&address=${accounts[0]}&tag=latest&apikey=${CONFIG.BSCSCAN_API_KEY}`
                    );
                    const balanceData = await balanceResponse.json();
                    if (balanceData.status === '1') {
                        setUserBalance(parseFloat(balanceData.result) / 1e18);
                    }
                } catch (error) {
                    console.error('Wallet connection error:', error);
                    if (error.code === 4001) alert('Connection rejected');
                }
            };

            const disconnectWallet = () => {
                setConnectedWallet(null);
                setUserBalance(0);
            };

            const formatNumber = (num) => {
                if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
                if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
                return Number(num || 0).toFixed(2);
            };

            const formatAddress = (addr) => {
                if (!addr) return '';
                return addr.slice(0, 6) + '...' + addr.slice(-4);
            };

            const formatTime = (timestamp) => {
                const now = Math.floor(Date.now() / 1000);
                const diff = now - parseInt(timestamp);
                if (diff < 60) return diff + 's ago';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                return Math.floor(diff / 86400) + 'd ago';
            };

            useEffect(() => {
                fetchAllMetrics();
            }, []);

            useEffect(() => {
                if (!autoRefresh) return;

                const interval = setInterval(() => {
                    setCountdown(prev => {
                        if (prev <= 1) {
                            fetchAllMetrics();
                            return 30;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(interval);
            }, [autoRefresh]);

            useEffect(() => {
                if (typeof TradingView !== 'undefined') {
                    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                    new TradingView.widget({
                        autosize: true,
                        symbol: "BINANCE:BNBUSDT",
                        interval: "60",
                        timezone: "Etc/UTC",
                        theme: currentTheme === 'dark' ? 'dark' : 'light',
                        style: "1",
                        locale: "en",
                        toolbar_bg: "#f1f3f6",
                        enable_publishing: false,
                        allow_symbol_change: true,
                        container_id: "tradingview_chart"
                    });
                }
            }, []);

            return (
                <div className="dashboard-container">
                    <nav className="page-nav">
                        <a href="index.html" className="nav-link">Main Guide</a>
                        <a href="ptdtapidocs.html" className="nav-link">API Docs</a>
                        <a href="ptdtsecurityresponsepage.html" className="nav-link">Security</a>
                        <a href="ptdtpdfpackage.html" className="nav-link">Downloads</a>
                        <a href="ptdtdashboard.html" className="nav-link active">Dashboard</a>
                    </nav>

                    <div className="tabloid-header">
                        <div className="logo-container-centered logo-float"><PTDTLogo /></div>
                        <div className="header-separator"></div>
                        <div className="brand-title">Live Dashboard v3.2</div>
                        <p className="subtitle">Real-Time PTDT Token Metrics & Analytics</p>
                        <div className="brand-badge"><span className="dot"></span>Peether PTDT • BSC Mainnet</div>
                        <div className={`api-status ${metrics.error ? 'error' : ''}`}>
                            <span className="status-dot"></span>
                            {metrics.error ? 'Reconnecting...' : 'DexScreener Active'}
                        </div>
                    </div>

                    <div className="flex gap-3 flex-wrap justify-center mt-6">
                        {connectedWallet ? (
                            <div className="flex gap-2">
                                <div className="bg-white/20 backdrop-blur-sm px-4 py-2 rounded-lg">
                                    <div className="text-xs" style={{color: 'rgba(255,255,255,0.7)'}}>Your Balance</div>
                                    <div className="font-bold text-white">{formatNumber(userBalance)} PTDT</div>
                                </div>
                                <button onClick={disconnectWallet} className="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2 text-white">
                                    <Icon name="x" className="w-4 h-4" /> Disconnect
                                </button>
                            </div>
                        ) : (
                            <button onClick={connectWallet} className="bg-white px-6 py-2 rounded-lg font-semibold hover:bg-pink-50 transition flex items-center gap-2" style={{color: '#fb0b8c'}}>
                                <Icon name="wallet" className="w-4 h-4" /> Connect Wallet
                            </button>
                        )}

                        <button onClick={() => setAutoRefresh(!autoRefresh)} className={`px-4 py-2 rounded-lg font-semibold transition ${autoRefresh ? 'bg-white' : 'bg-pink-700'}`} style={autoRefresh ? {color: '#fb0b8c'} : {color: 'white'}}>
                            Auto {autoRefresh ? 'ON' : 'OFF'}
                        </button>

                        <button onClick={fetchAllMetrics} disabled={metrics.loading} className="bg-white px-6 py-2 rounded-lg font-semibold hover:bg-pink-50 transition flex items-center gap-2 disabled:opacity-50" style={{color: '#fb0b8c'}}>
                            <Icon name="refresh-cw" className={`w-4 h-4 ${metrics.loading ? 'animate-spin' : ''}`} /> Refresh
                        </button>
                    </div>

                    {autoRefresh && (
                        <div className="mt-4 text-sm flex items-center gap-2 justify-center" style={{color: 'rgba(255,255,255,0.7)'}}>
                            <Icon name="clock" className="w-4 h-4" /> Next refresh in {countdown}s
                        </div>
                    )}

                    {metrics.error && (
                        <div className="mt-4 bg-yellow-500/20 border border-yellow-300 rounded-lg p-3 flex items-center gap-2">
                            <Icon name="alert-circle" className="w-5 h-5" /> <span className="text-sm">{metrics.error}</span>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-pink-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-gray-600 text-sm font-semibold">PRICE</span>
                                <Icon name="dollar-sign" className="w-5 h-5 text-pink-500" />
                            </div>
                            {metrics.loading ? <LoadingSkeleton /> : (
                                <>
                                    <div className="text-3xl font-bold text-gray-900">${metrics.price.toFixed(5)}</div>
                                    <div className={`text-sm font-semibold mt-1 ${metrics.priceChange24h >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                        {metrics.priceChange24h >= 0 ? '↑' : '↓'} {Math.abs(metrics.priceChange24h).toFixed(2)}% 24h
                                    </div>
                                </>
                            )}
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-blue-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-gray-600 text-sm font-semibold">MARKET CAP</span>
                                <Icon name="trending-up" className="w-5 h-5 text-blue-500" />
                            </div>
                            {metrics.loading ? <LoadingSkeleton /> : (
                                <>
                                    <div className="text-3xl font-bold text-gray-900">${formatNumber(metrics.marketCap)}</div>
                                    <div className="text-xs text-gray-500 mt-1">Fully Diluted</div>
                                </>
                            )}
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-green-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-gray-600 text-sm font-semibold">HOLDERS</span>
                                <Icon name="users" className="w-5 h-5 text-green-500" />
                            </div>
                            {metrics.loading ? <LoadingSkeleton /> : (
                                <>
                                    <div className="text-3xl font-bold text-gray-900">{metrics.holders ? metrics.holders.toLocaleString() : '—'}</div>
                                    <div className="text-xs text-gray-500 mt-1">(Removed Top 10 section)</div>
                                </>
                            )}
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-purple-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-gray-600 text-sm font-semibold">24H VOLUME</span>
                                <Icon name="activity" className="w-5 h-5 text-purple-500" />
                            </div>
                            {metrics.loading ? <LoadingSkeleton /> : (
                                <>
                                    <div className="text-3xl font-bold text-gray-900">${formatNumber(metrics.volume24h)}</div>
                                    <div className="text-xs text-gray-500 mt-1">{metrics.transactions24h} transactions</div>
                                </>
                            )}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-4"><Icon name="bar-chart-3" className="w-5 h-5 text-pink-600" /><h3 className="text-lg font-bold text-gray-900">Supply Info</h3></div>
                            <div className="space-y-3">
                                <div className="flex justify-between items-center"><span className="text-gray-600 text-sm">Total Supply</span><span className="font-bold text-gray-900">{formatNumber(metrics.totalSupply)} PTDT</span></div>
                                <div className="flex justify-between items-center"><span className="text-gray-600 text-sm">Circulating</span><span className="font-bold text-green-600">{formatNumber(metrics.circulatingSupply)} PTDT</span></div>
                                <div className="h-2 bg-gray-200 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-green-500 to-green-600" style={{width: `${(metrics.circulatingSupply / metrics.totalSupply) * 100}%`}}></div></div>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-4"><Icon name="flame" className="w-5 h-5 text-orange-600" /><h3 className="text-lg font-bold text-gray-900">Burned Tokens</h3></div>
                            <div className="space-y-3">
                                <div className="text-4xl font-bold text-orange-600">{formatNumber(metrics.burnedTokens)}</div>
                                <div className="text-sm text-gray-600">{((metrics.burnedTokens / metrics.totalSupply) * 100).toFixed(2)}% of supply burned</div>
                                <div className="flex items-center gap-2 text-xs text-gray-500"><Icon name="check" className="w-4 h-4 text-green-600" />Permanently removed</div>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-4"><Icon name="lock" className="w-5 h-5 text-blue-600" /><h3 className="text-lg font-bold text-gray-900">LP Locked</h3></div>
                            <div className="space-y-3">
                                <div className="text-4xl font-bold text-blue-600">{formatNumber(metrics.lpLocked)}</div>
                                <div className="text-sm text-gray-600">LP Tokens secured</div>
                                <div className="flex items-center gap-2 text-xs text-gray-500"><Icon name="check" className="w-4 h-4 text-green-600" />90 days lock period</div>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-4"><Icon name="droplet" className="w-5 h-5 text-cyan-600" /><h3 className="text-lg font-bold text-gray-900">Liquidity</h3></div>
                            <div className="space-y-3">
                                <div className="text-4xl font-bold text-cyan-600">${formatNumber(metrics.liquidity)}</div>
                                <div className="text-sm text-gray-600">Total liquidity</div>
                                <div className="flex items-center gap-2 text-xs text-gray-500"><Icon name="check" className="w-4 h-4 text-green-600" />PancakeSwap V2</div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6 hover:shadow-xl transition-shadow">
                        <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                            <Icon name="bar-chart-3" className="w-5 h-5 text-pink-600" /> 📈 Live Price Chart
                        </h3>
                        <div className="tradingview-widget-container" style={{height: '500px', width: '100%'}}>
                            <div id="tradingview_chart" style={{height: '100%', width: '100%'}}></div>
                        </div>
                        <div className="mt-4 text-xs text-gray-500">Chart powered by TradingView - Updates in real-time</div>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6 hover:shadow-xl transition-shadow">
                        <h3 className="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                            <Icon name="activity" className="w-5 h-5 text-pink-600" /> Recent Transactions
                        </h3>
                        <div className="space-y-3">
                            {metrics.loading ? (
                                Array(5).fill(0).map((_, i) => (
                                    <div key={i} className="p-4 bg-gray-50 rounded-lg"><LoadingSkeleton /></div>
                                ))
                            ) : recentTxs.length > 0 ? (
                                recentTxs.map((tx, idx) => (
                                    <div key={idx} className={`flex items-center justify-between p-4 rounded-lg transition-all ${tx.isWhale ? 'bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-300' : 'bg-gray-50 hover:bg-gray-100'}`}>
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-1">
                                                {tx.isWhale && <span className="bg-yellow-500 text-white text-xs font-bold px-2 py-1 rounded-full">🐋 WHALE</span>}
                                                <span className="font-mono text-sm text-gray-600">{formatAddress(tx.from)}</span>
                                                <span className="text-gray-400">→</span>
                                                <span className="font-mono text-sm text-gray-600">{formatAddress(tx.to)}</span>
                                            </div>
                                            <div className="text-xs text-gray-500">{formatTime(tx.timeStamp)} • {tx.kind === 'tokentx' ? 'PTDT transfer' : 'Contract tx'}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="font-semibold text-gray-900">
                                                {tx.kind === 'tokentx' ? `${formatNumber(tx.value)} PTDT` : `${formatNumber(tx.value)} BNB`}
                                            </div>
                                            <a href={`https://bscscan.com/tx/${tx.hash}`} target="_blank" rel="noopener noreferrer" className="text-xs text-pink-600 hover:text-pink-700 flex items-center gap-1 justify-end">
                                                View TX <Icon name="external-link" className="w-3 h-3" />
                                            </a>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div className="py-8 text-center text-gray-500">
                                    No recent transactions returned by BscScan for this contract right now.
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="bg-gradient-to-r from-pink-500 to-purple-600 rounded-xl shadow-lg p-6 text-white mb-6">
                        <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><Icon name="external-link" className="w-5 h-5" /> Quick Links & Resources</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <a href={`https://bscscan.com/token/${CONFIG.CONTRACT_ADDRESS}`} target="_blank" rel="noopener noreferrer" className="bg-white/20 backdrop-blur-sm hover:bg-white/30 p-4 rounded-lg transition-all flex items-center gap-3">
                                <Icon name="external-link" className="w-5 h-5" />
                                <div><div className="font-semibold">BSCScan</div><div className="text-xs text-pink-100">View Contract</div></div>
                            </a>
                            <a href={`https://pancakeswap.finance/swap?outputCurrency=${CONFIG.CONTRACT_ADDRESS}`} target="_blank" rel="noopener noreferrer" className="bg-white/20 backdrop-blur-sm hover:bg-white/30 p-4 rounded-lg transition-all flex items-center gap-3">
                                <Icon name="dollar-sign" className="w-5 h-5" />
                                <div><div className="font-semibold">PancakeSwap</div><div className="text-xs text-pink-100">Trade PTDT</div></div>
                            </a>
                            <a href={`https://dexscreener.com/bsc/${CONFIG.LP_PAIR_ADDRESS}`} target="_blank" rel="noopener noreferrer" className="bg-white/20 backdrop-blur-sm hover:bg-white/30 p-4 rounded-lg transition-all flex items-center gap-3">
                                <Icon name="bar-chart-3" className="w-5 h-5" />
                                <div><div className="font-semibold">DexScreener</div><div className="text-xs text-pink-100">View Chart</div></div>
                            </a>
                        </div>
                    </div>

                    <div className="text-center text-gray-500 text-sm space-y-2 pb-8">
                        <p className="font-semibold">Last updated: {metrics.lastUpdate?.toLocaleTimeString() || 'Loading...'}</p>
                        <p>Peether Token (PTDT) - BSC Mainnet</p>
                        <p className="text-xs font-mono">{CONFIG.CONTRACT_ADDRESS}</p>
                        <p className="text-xs text-gray-400">Data refreshes automatically every 30 seconds</p>
                        <p className="text-xs text-gray-400">Powered by DexScreener & BSCScan APIs</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PTDTDashboard />);
    </script>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const htmlElement = document.documentElement;

        const currentTheme = localStorage.getItem('ptdt-theme') || 'light';
        htmlElement.setAttribute('data-theme', currentTheme);
        updateIcons(currentTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('ptdt-theme', newTheme);
            updateIcons(newTheme);
        });

        function updateIcons(theme) {
            if (theme === 'dark') {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
